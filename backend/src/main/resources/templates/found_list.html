<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8"/>
  <title>Found List</title>
  <link rel="stylesheet" th:href="@{/css/app.css}"/>
</head>
<body class="container">
  <h1>Buluntu Listesi</h1>
  <a th:href="@{/}">← Home</a>

  <form method="get" th:action="@{/found/list}">
    <label>Category</label>
    <input id="filterCategory" name="category" type="text" th:value="${category}"/>
    <label>Location</label>
    <input id="filterLocation" name="location" type="text" th:value="${location}"/>
    <button id="btnFilter" type="submit">Filter</button>
  </form>

  <table>
    <thead><tr><th>ID</th><th>Title</th><th>Category</th><th>Location</th><th>Status</th><th>Claim</th></tr></thead>
    <tbody>
      <tr th:each="x: ${items}">
        <td th:text="${x.id}"></td>
        <td th:text="${x.title}"></td>
        <td th:text="${x.category}"></td>
        <td th:text="${x.location}"></td>
        <td th:text="${x.status}"></td>
        <td><a class="btn" th:href="@{'/claim/new/' + ${x.id}}" th:attr="id=${'claimLink_' + x.id}">Claim</a></td>
      </tr>
    </tbody>
  </table>
</body>
</html>
