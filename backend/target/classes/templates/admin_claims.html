<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8"/>
  <title>Admin Claims</title>
  <link rel="stylesheet" th:href="@{/css/app.css}"/>
</head>
<body class="container">
  <h1>Admin - Pending Claims</h1>
  <a th:href="@{/}">← Home</a>

  <table>
    <thead><tr><th>ID</th><th>UserId</th><th>FoundId</th><th>Status</th><th>Actions</th></tr></thead>
    <tbody>
      <tr th:each="c: ${items}">
        <td th:text="${c.id}"></td>
        <td th:text="${c.userId}"></td>
        <td th:text="${c.foundId}"></td>
        <td th:text="${c.status}"></td>
        <td>
          <form method="post" th:action="@{'/admin/claims/' + ${c.id} + '/approve'}" style="display:inline">
            <button th:attr="id=${'btnApprove_' + c.id}" type="submit">Approve</button>
          </form>
          <form method="post" th:action="@{'/admin/claims/' + ${c.id} + '/reject'}" style="display:inline">
            <button th:attr="id=${'btnReject_' + c.id}" type="submit">Reject</button>
          </form>
        </td>
      </tr>
    </tbody>
  </table>
</body>
</html>
