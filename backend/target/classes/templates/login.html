<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8"/>
  <title>Login</title>
  <link rel="stylesheet" th:href="@{/css/app.css}"/>
</head>
<body class="container">
  <h1>Lost&Found - Login</h1>

  <div class="hint">
    <p><b>Demo kullanıcılar:</b></p>
    <ul>
      <li>admin@demo.com / admin123</li>
      <li>staff@demo.com / staff123</li>
      <li>user@demo.com / user123</li>
    </ul>
  </div>

  <form method="post" th:action="@{/login}">
    <label>Email</label>
    <input id="email" name="username" type="text"/>

    <label>Password</label>
    <input id="password" name="password" type="password"/>

    <button id="btnLogin" type="submit">Login</button>

    <div class="msg err" th:if="${param.error}">Login failed</div>
    <div class="msg ok" th:if="${param.logout}">Logged out</div>
  </form>
</body>
</html>
