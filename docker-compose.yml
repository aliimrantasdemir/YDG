services:
  app:
    build:
      context: ./backend
    container_name: ydg-ci-app
    ports:
      - "8082:8081"
    volumes:
      - ./data:/app/data
    environment:
       - SPRING_PROFILES_ACTIVE=e2e
       - DB_PATH=/app/data/lostfound.db
    restart: unless-stopped

  selenium:
    image: selenium/standalone-chrome:latest
    environment:
    - 'SE_NODE_STEREOTYPE={"browserName":"chrome","platformName":"Linux","goog:chromeOptions":{"binary":"/usr/bin/google-chrome","args":["--disable-features=HttpsUpgrades,HttpsFirstMode","--no-sandbox","--disable-dev-shm-usage"]}}'
    container_name: ydg-ci-selenium
    shm_size: 2gb
    ports:
      - "4445:4444"
    restart: unless-stopped

  jenkins:
    image: jenkins/jenkins:lts-jdk17
    container_name: ydg-ci-jenkins
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      # Jenkins container içinden docker çalıştırmak için:
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

volumes:
  jenkins_home:
